<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>456 Growth — Brand Intelligence</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a18;font-size:13px}
.container{max-width:1400px;margin:0 auto;padding:1.5rem}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:.75rem}
h1{font-size:18px;font-weight:600;letter-spacing:-.01em}
.live{display:flex;align-items:center;gap:5px;font-size:11px;color:#5f5e5a;background:#fff;border:.5px solid #e0ddd6;border-radius:20px;padding:3px 10px}
.dot{width:6px;height:6px;border-radius:50%;background:#1D9E75;animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1.25rem}
.stat{background:#fff;border:.5px solid #e0ddd6;border-radius:10px;padding:.875rem 1rem}
.stat-label{font-size:11px;color:#888780;margin-bottom:4px}
.stat-val{font-size:20px;font-weight:600;line-height:1.2}
.filters{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.filters input,.filters select{font-size:12px;padding:6px 10px;border-radius:8px;border:.5px solid #d3d1c7;background:#fff;color:#1a1a18;outline:none}
.filters input{flex:1;min-width:160px}
.filters input:focus,.filters select:focus{border-color:#378ADD}
.btn{font-size:12px;padding:6px 14px;border-radius:8px;border:.5px solid #d3d1c7;background:#fff;color:#1a1a18;cursor:pointer}
.btn:hover{background:#f0f0ee}
.updated{font-size:11px;color:#888780}
.tbl-wrap{background:#fff;border:.5px solid #e0ddd6;border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead{background:#f5f5f3}
th{text-align:left;padding:9px 11px;font-weight:500;color:#888780;font-size:11px;border-bottom:.5px solid #e0ddd6;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:#1a1a18}
td{padding:9px 11px;border-bottom:.5px solid #e0ddd6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;vertical-align:middle}
tr.cr{cursor:pointer}
tr.cr:hover td{background:#fafaf8}
tr.dr>td{padding:0;white-space:normal;overflow:visible;border-bottom:.5px solid #b4b2a9}
.dp{padding:1.25rem;background:#fafaf8}
.ps{background:#fff;border:.5px solid #e0ddd6;border-radius:8px;padding:.875rem}
.ps h4{font-size:10px;font-weight:600;color:#888780;margin-bottom:.625rem;text-transform:uppercase;letter-spacing:.06em}
.creator-table{width:100%;border-collapse:collapse;font-size:11px}
.creator-table th{text-align:left;padding:4px 8px;font-weight:500;color:#888780;border-bottom:.5px solid #e0ddd6;font-size:10px}
.creator-table td{padding:5px 8px;border-bottom:.5px solid #e0ddd6}
.creator-table tr:last-child td{border-bottom:none}
.creator-table tr:hover td{background:#fafaf8}
.bar-wrap{display:flex;align-items:center;gap:6px}
.bar{height:4px;border-radius:2px;background:#378ADD;min-width:2px}
.handle-link{color:#185FA5;text-decoration:none;font-weight:600}
.handle-link:hover{text-decoration:underline}
.loading{text-align:center;padding:3rem;color:#888780}
.empty{text-align:center;padding:2rem;color:#888780;font-size:12px}
.mt{color:#888780;font-size:11px;padding:4px 0}
.notice{background:#E6F1FB;border:.5px solid #b8d4f0;border-radius:8px;padding:.75rem 1rem;font-size:12px;color:#0C447C;margin-bottom:1rem;display:none}
.back-link{font-size:12px;color:#185FA5;text-decoration:none;font-weight:600}
.back-link:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="container">

  <!-- TOP BAR -->
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <h1 id="page-title">456 Growth &mdash; Brand Intelligence</h1>
      <div class="live"><span class="dot"></span>Live</div>
      <a class="back-link" href="./">&larr; Creators dashboard</a>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="updated" id="updated-at"></span>
      <button class="btn" onclick="loadData()">&#8635; Refresh</button>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat"><div class="stat-label">Total brands</div><div class="stat-val" id="s-brands">—</div></div>
    <div class="stat"><div class="stat-label">Total GMV (30d)</div><div class="stat-val" id="s-gmv">—</div></div>
    <div class="stat"><div class="stat-label">Total videos</div><div class="stat-val" id="s-vids">—</div></div>
    <div class="stat"><div class="stat-label">Total views</div><div class="stat-val" id="s-views">—</div></div>
    <div class="stat"><div class="stat-label">Last synced</div><div class="stat-val" id="s-sync" style="font-size:13px;padding-top:2px">—</div></div>
  </div>

  <div class="notice" id="notice">No brand data yet. Run runBrandRollup() in Apps Script.</div>

  <!-- FILTERS -->
  <div class="filters">
    <input type="text" id="search" placeholder="Search brand..." oninput="render()">
    <select id="f-min" onchange="render()">
      <option value="0">Any GMV</option>
      <option value="100000">$100K+</option>
      <option value="50000">$50K+</option>
      <option value="10000">$10K+</option>
      <option value="1000">$1K+</option>
    </select>
    <select id="f-creators" onchange="render()">
      <option value="0">Any creator count</option>
      <option value="50">50+ creators</option>
      <option value="20">20+ creators</option>
      <option value="5">5+ creators</option>
    </select>
  </div>

  <div class="tbl-wrap">
    <div id="tbl"><div class="loading">Loading brand data...</div></div>
  </div>

</div>
<script>
// ============================================================
// STATE
// ============================================================
var DATA = [];
var openRow = null;
var sortCol = 'gmv', sortAsc = false;

// ============================================================
// INIT
// ============================================================
var API_URL = 'https://script.google.com/macros/s/AKfycbxI0as4vxdoXpl2yJSG1EKL3ftfSK2Amxx4TqpAYiTQCDLK6U8Wz1nDl4GT2UE1j76B/exec?tab=brand';

function loadData() {
  document.getElementById('tbl').innerHTML = '<div class="loading">Fetching brand data...</div>';
  fetch(API_URL)
    .then(function(r) { return r.json(); })
    .then(onLoaded)
    .catch(onErr);
}

function onLoaded(r) {
  if (!r.success) { onErr({message: r.error}); return; }
  DATA = r.data || [];

  document.getElementById('updated-at').textContent = 'Synced ' + new Date().toLocaleTimeString();
  document.getElementById('s-sync').textContent = r.lastUpdated || '—';

  if (!DATA.length) {
    document.getElementById('notice').style.display = 'block';
    document.getElementById('tbl').innerHTML = '<div class="empty">No brand data yet. Run runBrandRollup() in Apps Script.</div>';
    return;
  }

  document.getElementById('notice').style.display = 'none';

  var totalGmv = 0, totalVids = 0, totalViews = 0;
  DATA.forEach(function(b) {
    totalGmv   += (b.gmv || 0);
    totalVids  += (b.totalVideos || 0);
    totalViews += (b.totalViews || 0);
  });
  document.getElementById('s-brands').textContent = DATA.length;
  document.getElementById('s-gmv').textContent    = fmtGMV(totalGmv);
  document.getElementById('s-vids').textContent   = fmtNum(totalVids);
  document.getElementById('s-views').textContent  = fmtNum(totalViews);

  render();
}

function onErr(e) {
  document.getElementById('tbl').innerHTML = '<div class="loading" style="color:#A32D2D">Error: ' + (e.message || 'unknown') + '</div>';
}

function render() {
  var q      = document.getElementById('search').value.toLowerCase();
  var gmvMin = parseInt(document.getElementById('f-min').value) || 0;
  var cMin   = parseInt(document.getElementById('f-creators').value) || 0;

  var f = DATA.filter(function(b) {
    if (q && b.name.toLowerCase().indexOf(q) < 0) return false;
    if (gmvMin && b.gmv < gmvMin) return false;
    if (cMin && b.creatorCount < cMin) return false;
    return true;
  });

  f.sort(function(a, b) {
    var av, bv;
    if      (sortCol === 'gmv')   { av = a.gmv;         bv = b.gmv; }
    else if (sortCol === 'name')  { av = a.name;         bv = b.name; }
    else if (sortCol === 'vids')  { av = a.totalVideos;  bv = b.totalVideos; }
    else if (sortCol === 'views') { av = a.totalViews;   bv = b.totalViews; }
    else if (sortCol === 'ct')    { av = a.creatorCount; bv = b.creatorCount; }
    else                           { av = a.gmv;          bv = b.gmv; }
    if (av < bv) return sortAsc ? -1 : 1;
    if (av > bv) return sortAsc ?  1 : -1;
    return 0;
  });

  var maxGmv = f.length ? (f[0].gmv || 1) : 1;

  var h = '<table><thead><tr>';
  h += th('#', 'idx', '4%');
  h += th('Brand', 'name', '22%');
  h += th('Total GMV (30d)', 'gmv', '13%');
  h += th('Videos', 'vids', '9%');
  h += th('Views', 'views', '10%');
  h += th('Creators', 'ct', '9%');
  h += '<th style="width:33%">GMV bar</th>';
  h += '</tr></thead><tbody>';

  if (!f.length) {
    h += '<tr><td colspan="7"><div class="empty">No brands match.</div></td></tr>';
  } else {
    f.forEach(function(b, i) {
      var isOpen = openRow === b.name;
      var barW   = Math.max(2, Math.round((b.gmv / maxGmv) * 200));
      h += '<tr class="cr" onclick="toggle(\'' + esc(b.name) + '\')">';
      h += '<td style="color:#888780;font-size:11px">' + (i + 1) + '</td>';
      h += '<td style="font-weight:600">' + esc(b.name) + '</td>';
      h += '<td style="font-weight:600;color:#185FA5">' + esc(b.gmvDisplay) + '</td>';
      h += '<td style="color:#888780">' + fmtNum(b.totalVideos) + '</td>';
      h += '<td style="color:#888780">' + esc(b.viewsDisplay) + '</td>';
      h += '<td style="color:#888780">' + b.creatorCount + '</td>';
      h += '<td><div class="bar-wrap"><div class="bar" style="width:' + barW + 'px;background:#1D9E75"></div><span style="font-size:10px;color:#888780;margin-left:4px">' + (isOpen ? '▲' : '▼') + '</span></div></td>';
      h += '</tr>';

      if (isOpen) {
        h += '<tr class="dr"><td colspan="7">' + buildDetail(b) + '</td></tr>';
      }
    });
  }

  h += '</tbody></table>';
  document.getElementById('tbl').innerHTML = h;
}

function buildDetail(b) {
  if (!b.creators || !b.creators.length) return '<div style="padding:1rem;color:#888780;font-size:12px">No creator breakdown available.</div>';

  var maxC = b.creators[0].gmv || 1;
  var rows = '<table class="creator-table"><thead><tr><th>#</th><th>Creator</th><th>GMV (30d)</th><th>Videos</th><th>Views</th><th></th></tr></thead><tbody>';
  b.creators.forEach(function(c, i) {
    var w = Math.max(2, Math.round((c.gmv / maxC) * 120));
    rows += '<tr>';
    rows += '<td style="color:#888780">' + (i + 1) + '</td>';
    rows += '<td><a class="handle-link" href="https://www.tiktok.com/@' + esc(c.handle) + '" target="_blank" onclick="event.stopPropagation()">@' + esc(c.handle) + '</a></td>';
    rows += '<td style="font-weight:600">' + fmtGMV(c.gmv) + '</td>';
    rows += '<td style="color:#888780">' + fmtNum(c.videos) + '</td>';
    rows += '<td style="color:#888780">' + fmtNum(c.views) + '</td>';
    rows += '<td><div class="bar-wrap"><div class="bar" style="width:' + w + 'px;background:#378ADD"></div></div></td>';
    rows += '</tr>';
  });
  rows += '</tbody></table>';
  return '<div class="dp"><div class="ps"><h4>Creator breakdown (30d)</h4>' + rows + '</div></div>';
}

function toggle(name) { openRow = openRow === name ? null : name; render(); }

function th(label, col, width) {
  var arrow = sortCol === col ? (sortAsc ? ' ↑' : ' ↓') : '';
  return '<th style="width:' + width + '" onclick="sort(\'' + col + '\')">' + label + arrow + '</th>';
}

function sort(col) {
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = (col === 'name'); }
  render();
}

// ============================================================
// UTILITIES
// ============================================================
function fmtGMV(n) {
  if (!n && n !== 0) return '—';
  n = parseFloat(n); if (isNaN(n)) return '—';
  if (n >= 1000000) return '$' + (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000)    return '$' + Math.round(n / 1000) + 'K';
  return '$' + Math.round(n);
}

function fmtNum(n) {
  if (!n) return '—';
  n = parseFloat(n); if (isNaN(n)) return '—';
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000)    return Math.round(n / 1000) + 'K';
  return String(Math.round(n));
}

function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

loadData();
</script>
</body>
</html>
